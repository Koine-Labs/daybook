[project]
name = "daybook-inference"
version = "0.0.1"
description = "Daybook Python AI pipeline: FastAPI inference server + analysis suite (sleep stage classifier, cue selection, wisp utterance generation)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=13.0",  # need websockets.asyncio.server/client (landed in 13)
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "PyJWT>=2.8.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # Parquet I/O engine for pandas — classifier feature cache + L4 REM-predictor
    # regression tests read classifier/runs/*.parquet (present transitively; declared explicit).
    "pyarrow>=15.0",
    "httpx>=0.27.0",
    # Postgres + env loading (added 2026-05-17 for Daybook v0)
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Voice loop + continuous-mic stack (Weeks 2/3). Heavy — pulls torch via
# silero-vad / resemblyzer. NOT required to run or test the L1–L6 nervous-system
# core/layers; install only on nodes that do voice I/O:
#     uv pip install -e ".[voice]"
voice = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "faster-whisper>=1.0.0",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.17.0",
    "silero-vad>=5.1",
    "resemblyzer>=0.1.3",
    "librosa>=0.10.0",
]
ambient = [
    # YAMNet ambient classifier — heavy, isolated behind a lazy backend (Week 3 Task 6).
    # `uv pip install ".[ambient]"` to enable; the loop writes no ambient packets until then.
    "tensorflow>=2.15",
    "tensorflow-hub>=0.16",
]
analysis = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "jupyter>=1.0",
    "shap>=0.42",
    "coremltools>=7.0",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
