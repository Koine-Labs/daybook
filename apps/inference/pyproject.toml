[project]
name = "daybook-inference"
version = "0.0.1"
description = "Daybook Python AI pipeline: FastAPI inference server + analysis suite (sleep stage classifier, cue selection, wisp utterance generation)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "PyJWT>=2.8.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    # Postgres + env loading (added 2026-05-17 for Daybook v0)
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    # Voice loop — audio I/O (Week 2, 2026-05-28). TTS ships on macOS `say`
    # (no dep); kokoro is optional. sounddevice/soundfile back playback + WAV.
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    # Streaming STT for the wake-word path (Week 2). stt_streaming defaults to
    # faster-whisper small.en/int8; stt.py uses recall.whisper_client (openai-whisper).
    "faster-whisper>=1.0.0",
    # Wake-word detection (Week 2). openWakeWord runs the ONNX wake model;
    # ships on built-in 'hey_jarvis' until the custom 'hey_regis.onnx' is trained.
    "openwakeword>=0.6.0",
    "onnxruntime>=1.17.0",
    # Continuous mic semantic pipeline (Week 3). silero-vad (VAD), resemblyzer
    # (speaker embedding), librosa (prosody/resample). torch + scikit-learn already present.
    "silero-vad>=5.1",
    "resemblyzer>=0.1.3",
    "librosa>=0.10.0",
]

[project.optional-dependencies]
ambient = [
    # YAMNet ambient classifier — heavy, isolated behind a lazy backend (Week 3 Task 6).
    # `uv pip install ".[ambient]"` to enable; the loop writes no ambient packets until then.
    "tensorflow>=2.15",
    "tensorflow-hub>=0.16",
]
analysis = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "jupyter>=1.0",
    "shap>=0.42",
    "coremltools>=7.0",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
