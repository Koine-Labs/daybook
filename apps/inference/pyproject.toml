[project]
name = "daybook-inference"
version = "0.0.1"
description = "Daybook Python AI pipeline: FastAPI inference server + analysis suite (sleep stage classifier, cue selection, wisp utterance generation)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "PyJWT>=2.8.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "jupyter>=1.0",
    "shap>=0.42",
    "coremltools>=7.0",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
