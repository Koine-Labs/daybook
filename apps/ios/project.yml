name: Daybook
options:
  bundleIdPrefix: com.koinelabs
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # DEVELOPMENT_TEAM is set per-developer in Xcode UI (Signing & Capabilities).
    # Don't hardcode here — it'd get reset on every xcodegen regen.
    # For simulator: signing is auto-skipped; for real device: Xcode prompts you.
targets:
  Daybook:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Daybook
        excludes:
          - "Info.plist"
          - "Daybook.icon"
          - "Daybook-Local.plist"
          - "Daybook.entitlements"
      # Local-only override (gitignored). bin/cloudflare-tunnel-setup.sh writes
      # the real tunnel URL + API key into it. Listed as a resource-phase source
      # so xcodegen copies it into the .app bundle, where APIClient reads it via
      # Bundle.main.url(forResource: "Daybook-Local", withExtension: "plist").
      - path: Daybook/Daybook-Local.plist
        buildPhase: resources
        optional: true
    resources:
      - path: Daybook/Assets.xcassets
    info:
      path: Daybook/Info.plist
      properties:
        CFBundleDisplayName: Daybook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts: []
        # Defaults — overridden at runtime by Daybook-Local.plist (gitignored)
        # when present. Localhost works for simulator dev. For phone testing
        # via the Cloudflare Tunnel, bin/cloudflare-tunnel-setup.sh writes
        # the real URL + key into Daybook-Local.plist.
        DaybookAPIBaseURL: "http://localhost:8000"
        DaybookAPIKey: ""
        # HealthKit (#13)
        NSHealthShareUsageDescription: "Daybook reads your heart rate, HRV, and sleep so Regis can sense your body state."
    entitlements:
      path: "Daybook/Daybook.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koinelabs.daybook
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_PREVIEWS: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        CODE_SIGN_ENTITLEMENTS: "Daybook/Daybook.entitlements"
    dependencies: []

  DaybookWatch Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: "DaybookWatch Watch App"
        excludes:
          - "Info.plist"
          - "Daybook.icon"
    resources:
      - path: "DaybookWatch Watch App/Assets.xcassets"
    info:
      path: "DaybookWatch Watch App/Info.plist"
      properties:
        CFBundleDisplayName: Daybook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: com.koinelabs.daybook
        NSHealthShareUsageDescription: "Daybook reads your heart rate to show Regis your live state."
    entitlements:
      path: "DaybookWatch Watch App/DaybookWatch.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koinelabs.daybook.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        CODE_SIGN_ENTITLEMENTS: "DaybookWatch Watch App/DaybookWatch.entitlements"

schemes:
  DaybookWatch Watch App:
    build:
      targets:
        DaybookWatch Watch App: all
        Daybook: all
      postActions:
        - script: |
            # When running the Watch scheme, also install + launch the
            # companion iOS app on the iPhone simulator paired with the
            # watch Xcode chose. Logs to /tmp/daybook-post-build.log so
            # you can debug if it ever silently fails.
            LOG=/tmp/daybook-post-build.log
            : > "$LOG"
            echo "[post-build] $(date)" >> "$LOG"

            IOS_APP="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
            echo "iOS app: $IOS_APP" >> "$LOG"

            # Find the watch sim Xcode booted, then its paired iPhone.
            WATCH_UDID=$(xcrun simctl list devices booted 2>/dev/null \
              | grep -E "Apple Watch" \
              | head -1 \
              | grep -oE "[A-F0-9-]{36}")
            echo "watch udid: $WATCH_UDID" >> "$LOG"

            PHONE_UDID=""
            if [ -n "$WATCH_UDID" ]; then
              PHONE_UDID=$(xcrun simctl list pairs 2>/dev/null \
                | grep -A1 -B1 "$WATCH_UDID" \
                | grep "Phone:" \
                | grep -oE "[A-F0-9-]{36}" \
                | head -1)
            fi
            # Fallback: any booted iPhone.
            if [ -z "$PHONE_UDID" ]; then
              PHONE_UDID=$(xcrun simctl list devices booted 2>/dev/null \
                | grep -E "iPhone" \
                | head -1 \
                | grep -oE "[A-F0-9-]{36}")
            fi
            echo "phone udid: $PHONE_UDID" >> "$LOG"

            if [ -n "$PHONE_UDID" ] && [ -d "$IOS_APP" ]; then
              # Boot the phone if it isn't already (no-op when it is).
              xcrun simctl boot "$PHONE_UDID" >> "$LOG" 2>&1 || true
              xcrun simctl install "$PHONE_UDID" "$IOS_APP" >> "$LOG" 2>&1 || true
              xcrun simctl launch "$PHONE_UDID" com.koinelabs.daybook >> "$LOG" 2>&1 || true
              echo "[post-build] done" >> "$LOG"
            else
              echo "[post-build] skipped — no phone sim or app build" >> "$LOG"
            fi
          name: Install + launch companion iOS app
          settingsTarget: Daybook
    run:
      config: Debug
      executable: DaybookWatch Watch App
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
