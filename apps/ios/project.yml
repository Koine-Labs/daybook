name: Daybook
options:
  bundleIdPrefix: com.koinelabs
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # DEVELOPMENT_TEAM is set per-developer in Xcode UI (Signing & Capabilities).
    # Don't hardcode here — it'd get reset on every xcodegen regen.
    # For simulator: signing is auto-skipped; for real device: Xcode prompts you.
targets:
  Daybook:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Daybook
        excludes:
          - "Info.plist"
    resources:
      - path: Daybook/Assets.xcassets
    info:
      path: Daybook/Info.plist
      properties:
        CFBundleDisplayName: Daybook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koinelabs.daybook
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_PREVIEWS: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    dependencies: []

  DaybookWatch Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: "DaybookWatch Watch App"
        excludes:
          - "Info.plist"
    resources:
      - path: "DaybookWatch Watch App/Assets.xcassets"
    info:
      path: "DaybookWatch Watch App/Info.plist"
      properties:
        CFBundleDisplayName: Daybook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: com.koinelabs.daybook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koinelabs.daybook.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
