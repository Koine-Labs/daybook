name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-core:
    name: Python core + layers (DB-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # Install DEPENDENCIES from pyproject.toml (the authoritative dependency
      # source — there is intentionally no requirements.txt). We install deps, not
      # the project: apps/inference is a flat module layout run via PYTHONPATH, not
      # a built package. The lean base pulls psycopg + python-dotenv (db is
      # importable) but NOT the heavy [voice] stack (torch/audio) the L1–L6
      # layers don't use — so this stays fast.
      - name: Install inference deps
        working-directory: apps/inference
        run: uv pip install --system -r pyproject.toml --extra dev

      # The nervous-system core + six layer skeletons must import AND run with NO
      # DATABASE_URL present (no .env.local exists in CI) — guards the DB-free-at-
      # import property fixed for PR #38. A regression here means something pulled
      # db into an import path or required a live DB to run a unit test.
      # PYTHONDONTWRITEBYTECODE: never trust a .pyc cache. The privacy invariant
      # (Policy #1 pause-on-other-voice) is load-bearing, and a stale bytecode
      # cache can make a green suite mask a real regression — so CI runs from
      # source only.
      - name: Run core + layer suite without DATABASE_URL
        working-directory: apps/inference
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest core sensors features fusion prediction decision output bci -q

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
